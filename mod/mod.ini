[DuneLektorPL]

; @label Głośność lektora
; @description Głośność polskiego lektora (0 = wyłączony, 85 = domyślna, 100 = pełna głośność nagrania).
; @type integer
; @min 0
; @max 100
; @step 5
; @default 85
; @menu main, ingame
; @apply live
Glosnosc=85

; @label Tempo lektora
; @description Szybkość czytania (1.00 = nagranie bez zmian, bez zmiany wysokości głosu).
; @type number
; @min 0.8
; @max 1.5
; @step 0.05
; @default 1.15
; @menu main, ingame
; @apply live
Tempo=1.15

; @label Przerywanie przy pomijaniu [s]
; @description Nowa kwestia przerywa bieżącą, gdy lektorowi zostało więcej sekund niż tyle (pominięty dialog).
; @type number
; @min 0
; @max 5
; @step 0.5
; @default 2
; @menu main, ingame
; @apply live
Pomijanie=2
